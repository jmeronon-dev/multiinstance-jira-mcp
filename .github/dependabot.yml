# 🤖 Dependabot version updates for GitHub Actions and npm packages.
# Every action in .github/workflows/ is pinned to a full commit SHA with a
# `# vX.Y.Z` comment; Dependabot bumps both the SHA and that comment.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"

    # 📅 Weekly check, at the start of the working week.
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid

    # 🙈 *.lock.yml files are generated by `gh aw compile` from their .md source.
    # Their actions are updated by recompiling (see docs/lights-out.md), never by hand.
    exclude-paths:
      - ".github/workflows/*.lock.yml"

    # 🏷️ Labels declared in .github/labels.yml.
    labels:
      - "📦 dependencies"
      - "🏭 software-factory"

    # ✍️ Conventional Commits: "ci(deps): bump actions/checkout from ... to ...".
    commit-message:
      prefix: "ci"
      include: "scope"

  # 📦 Runtime and development dependencies (MCP SDK, Playwright, zod, TypeScript, Vitest...).
  - package-ecosystem: npm
    directory: "/"

    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid

    # 🧺 One PR for all minor and patch bumps; majors open their own PR (they may break the server).
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

    # 🏷️ Dependency bumps always need human review.
    labels:
      - "📦 dependencies"
      - "💡 lights-on"

    # ✍️ Conventional Commits: "build(deps): bump ..." / "build(deps-dev): bump ...".
    commit-message:
      prefix: "build"
      prefix-development: "build"
      include: "scope"
