# Source of truth for the repository labels used by the software factory.
# `🏷️ Sync labels` (.github/workflows/sync-labels.yml) creates or updates them;
# it never deletes labels that are not listed here. Label names are referenced by
# the issue templates, the triage skill, the workflows and docs/software-factory.md:
# rename them everywhere at once.

# 🚦 Triage status (exactly one after triage)
- name: "🔍 needs-triage"
  color: "ededed"
  description: "New Issue waiting for the triage workflow."
- name: "✅ agent-ready"
  color: "0e8a16"
  description: "Clear and verifiable: an agent can implement it."
- name: "📐 needs-spec"
  color: "fbca04"
  description: "Needs a design or specification before implementation."
- name: "💬 needs-info"
  color: "d876e3"
  description: "The author must add missing information."
- name: "🧑‍🏫 triage-corrected"
  color: "5319e7"
  description: "A person corrected the triage; the factory learns from it."

# 💡 Lights (only on ✅ agent-ready)
- name: "💡 lights-on"
  color: "fef2c0"
  description: "Changes user-visible behaviour: a person reviews the PR."
- name: "🌙 lights-out"
  color: "1d2b53"
  description: "Safe by construction: the PR may merge without human review."

# 📏 Complexity (exactly one after triage)
- name: "🟢 complexity-low"
  color: "c2e0c6"
  description: "1-2 files, no new logic."
- name: "🟡 complexity-medium"
  color: "fff5b1"
  description: "Bounded feature, new tool or several files."
- name: "🔴 complexity-high"
  color: "f9d0c4"
  description: "Auth, routing, architecture, dependencies or open scope."

# 🗂️ Type (set by the issue templates)
- name: "🐛 bug"
  color: "d73a4a"
  description: "Something does not work as documented."
- name: "✨ enhancement"
  color: "a2eeef"
  description: "Improvement of an existing behaviour."
- name: "🧰 new-tool"
  color: "0075ca"
  description: "Proposal for a new MCP tool."
- name: "🏭 software-factory"
  color: "6f42c1"
  description: "Workflows, templates, skills, hooks, instructions or labels."
- name: "🤖 agents"
  color: "bfdadc"
  description: "Changes how the agents work."
- name: "🔁 triage-learning"
  color: "c5def5"
  description: "PR that updates the triage rules."
- name: "📦 dependencies"
  color: "0366d6"
  description: "Dependency updates."

# 🧭 Area (at most one)
- name: "🔐 auth"
  color: "b60205"
  description: "Authentication: tokens, PATs, browser SSO, cookies."
- name: "🧭 routing"
  color: "1f6feb"
  description: "Instance registry, routing and login manager."
- name: "🧩 tools"
  color: "0e8a16"
  description: "MCP tool definitions, inputs and outputs."
- name: "🔌 jira-api"
  color: "006b75"
  description: "Jira REST client, ADF and formatting."
- name: "⚙️ config"
  color: "c5def5"
  description: "CLI flags, environment variables and config file."
- name: "📝 documentation"
  color: "0075ca"
  description: "Only documentation."
- name: "🚀 ci-release"
  color: "e99695"
  description: "CI, packaging and release."

# 🗃️ Resolution
- name: "♻️ duplicate"
  color: "cfd3d7"
  description: "Already reported."
- name: "⛔ wontfix"
  color: "ffffff"
  description: "Will not be done."
- name: "🚫 invalid"
  color: "e4e669"
  description: "Not a valid request."
